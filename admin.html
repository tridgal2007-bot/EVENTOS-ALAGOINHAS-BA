<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Cadastrar Evento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        alagoinhas: {
                            50:  '#F3F8FE', 100: '#E4EFFC', 200: '#C9DFF7', 300: '#93C2F1',
                            400: '#5CA3EA', 500: '#2E86DE', 600: '#1E6BC0', 700: '#17549C',
                            800: '#123F76', 900: '#0C2340',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Sora', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out 2s infinite',
                        'float-slow': 'float 12s ease-in-out 1s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-25px) rotate(2deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body, .glass-effect, .glass-card, input, select, textarea {
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { background-color: #F7FAFF; color: #0C2340; overflow-x: hidden; }
        .dark body { background-color: #0B1120; color: #F1F5F9; }

        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-effect { background: rgba(11, 17, 32, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(228, 239, 252, 0.8);
            box-shadow: 0 10px 40px -10px rgba(12, 35, 64, 0.08);
        }
        .dark .glass-card {
            background: rgba(21, 30, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .gradient-text {
            background: linear-gradient(135deg, #2E86DE 0%, #17549C 60%, #0C2340 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .dark .gradient-text {
            background: linear-gradient(135deg, #5CA3EA 0%, #2E86DE 60%, #93C2F1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .floating-shape { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; pointer-events: none; }
        .dark .floating-shape { opacity: 0.08; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F3F8FE; }
        .dark ::-webkit-scrollbar-track { background: #0B1120; }
        ::-webkit-scrollbar-thumb { background: #2E86DE; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #1E6BC0; }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.6);
            border: 2px solid #E4EFFC;
            border-radius: 1rem;
            padding: 0.85rem 1.1rem;
            color: #0C2340;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .dark .input-field {
            background: rgba(11,17,32,0.6);
            border-color: rgba(255,255,255,0.1);
            color: #F1F5F9;
        }
        .input-field:focus {
            outline: none;
            border-color: #2E86DE;
            box-shadow: 0 0 0 4px rgba(46,134,222,0.15);
            background: white;
        }
        .dark .input-field:focus { background: rgba(21,30,50,0.9); }

        #ticket-fields {
            border-left: 3px solid #2E86DE;
            padding-left: 1rem;
            margin-top: 0.5rem;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease, margin 0.4s ease;
        }
        #ticket-fields.open { max-height: 400px; opacity: 1; margin-top: 1rem; }

        .admin-event-row { transition: all 0.35s cubic-bezier(0.16,1,0.3,1); }
        .admin-event-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -10px rgba(46,134,222,0.25);
            border-color: rgba(46,134,222,0.35);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-slide-in { animation: fadeSlideIn 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="floating-shape w-[500px] h-[500px] bg-alagoinhas-500 top-0 -left-20 animate-float"></div>
        <div class="floating-shape w-[400px] h-[400px] bg-alagoinhas-400 top-40 right-0 animate-float-delayed"></div>
        <div class="floating-shape w-[300px] h-[300px] bg-alagoinhas-300 bottom-20 left-1/3 animate-float-slow"></div>
    </div>

    <header class="relative z-10 glass-effect border-b border-alagoinhas-100 dark:border-white/5 sticky top-0">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3 group cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-alagoinhas-400 to-alagoinhas-600 flex items-center justify-center transform group-hover:rotate-12 transition-all duration-500 shadow-lg shadow-alagoinhas-500/30">
                        <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black font-display gradient-text tracking-tight">ADMIN</h1>
                        <p class="text-[11px] text-alagoinhas-700 dark:text-alagoinhas-300 tracking-wide font-semibold uppercase">Painel de Eventos</p>
                    </div>
                </div>

                <nav class="flex items-center gap-4">
                    <a href="index.html" class="text-sm font-semibold text-alagoinhas-900/80 dark:text-alagoinhas-100/80 hover:text-alagoinhas-600 dark:hover:text-alagoinhas-400 transition-colors relative group py-2">
                        Início
                        <span class="absolute -bottom-0 left-0 w-0 h-0.5 bg-alagoinhas-500 group-hover:w-full transition-all duration-300 rounded-full"></span>
                    </a>
                    <a href="admin.html" class="text-sm font-semibold text-alagoinhas-600 dark:text-alagoinhas-400 relative py-2">
                        Admin
                        <span class="absolute -bottom-0 left-0 w-full h-0.5 bg-alagoinhas-500 rounded-full"></span>
                    </a>
                    <button id="theme-toggle" class="ml-2 p-2.5 rounded-xl bg-alagoinhas-100 dark:bg-white/10 text-alagoinhas-700 dark:text-alagoinhas-300 hover:bg-alagoinhas-200 dark:hover:bg-white/20 transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="sun" class="w-5 h-5 block dark:hidden text-amber-500"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-alagoinhas-300"></i>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <section class="relative z-10 pt-14 pb-8 px-4 sm:px-6 lg:px-8 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-effect mb-5 animate-float border border-alagoinhas-200 dark:border-white/10">
            <span class="w-2 h-2 bg-alagoinhas-500 rounded-full animate-pulse"></span>
            <span class="text-sm font-semibold text-alagoinhas-700 dark:text-alagoinhas-200">Painel administrativo</span>
        </div>
        <h2 class="text-4xl md:text-5xl font-black font-display mb-3 leading-tight tracking-tight">
            <span class="text-alagoinhas-900 dark:text-white">Gerenciar </span><span class="gradient-text">Eventos</span>
        </h2>
        <p class="text-alagoinhas-700/80 dark:text-alagoinhas-300/80 max-w-xl mx-auto">
            Publique novos eventos e gerencie a agenda cultural de Alagoinhas.
        </p>
    </section>

    <main class="relative z-10 flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pb-20 w-full">

        <div class="glass-card rounded-3xl p-6 sm:p-8 mb-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-11 h-11 rounded-2xl bg-alagoinhas-100 dark:bg-white/10 flex items-center justify-center">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-alagoinhas-600 dark:text-alagoinhas-300"></i>
                </div>
                <h3 class="text-xl font-bold font-display text-alagoinhas-900 dark:text-white">Novo Evento</h3>
            </div>

            <form id="event-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Nome do Evento</label>
                    <input type="text" id="name" required placeholder="Ex: Festa de São João" class="input-field" />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Descrição</label>
                    <textarea id="description" required placeholder="Descreva o evento..." rows="4" class="input-field resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Categoria</label>
                        <select id="category" required class="input-field appearance-none cursor-pointer">
                            <option value="shows">🎤 Shows e Música</option>
                            <option value="festas">🎉 Festas e Forró</option>
                            <option value="cultura">🎭 Cultura e Arte</option>
                            <option value="esportes">🏆 Esportes</option>
                            <option value="gastronomia">🍽️ Gastronomia</option>
                            <option value="infantil">🧒 Infantil</option>
                            <option value="religioso">⛪ Religioso</option>
                            <option value="outros">📌 Outros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Data e Hora</label>
                        <input type="datetime-local" id="date" required class="input-field" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">URL da Foto</label>
                    <input type="url" id="image" required placeholder="https://..." class="input-field" />
                </div>

                <label class="flex items-center gap-3 cursor-pointer select-none">
                    <input type="checkbox" id="has-ticket" class="w-5 h-5 rounded-md accent-alagoinhas-500" />
                    <span class="text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200">Evento com ingresso pago</span>
                </label>

                <div id="ticket-fields" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Preço do Ingresso (R$)</label>
                        <input type="number" id="price" step="0.01" min="0" placeholder="50.00" class="input-field" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-alagoinhas-800 dark:text-alagoinhas-200 mb-2">Link para compra</label>
                        <input type="url" id="link" placeholder="https://..." class="input-field" />
                    </div>
                </div>

                <button type="submit" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-alagoinhas-500 to-alagoinhas-600 hover:from-alagoinhas-400 hover:to-alagoinhas-500 text-white font-bold rounded-2xl py-4 shadow-lg shadow-alagoinhas-500/25 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl active:translate-y-0">
                    <i data-lucide="send" class="w-5 h-5"></i> Publicar Evento
                </button>

                <p id="form-msg" class="text-sm font-semibold min-h-[1.25rem]"></p>
            </form>
        </div>

        <div>
            <div class="flex items-center gap-3 mb-5">
                <div class="w-11 h-11 rounded-2xl bg-alagoinhas-100 dark:bg-white/10 flex items-center justify-center">
                    <i data-lucide="list-checks" class="w-5 h-5 text-alagoinhas-600 dark:text-alagoinhas-300"></i>
                </div>
                <h3 class="text-xl font-bold font-display text-alagoinhas-900 dark:text-white">Eventos Cadastrados</h3>
            </div>
            <div id="admin-events" class="space-y-3"></div>
        </div>

        <!-- NOVA SEÇÃO: GERENCIAR ADMINISTRADORES -->
        <div class="mt-12 pt-10 border-t border-alagoinhas-100 dark:border-white/5">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-11 h-11 rounded-2xl bg-alagoinhas-100 dark:bg-white/10 flex items-center justify-center">
                    <i data-lucide="users" class="w-5 h-5 text-alagoinhas-600 dark:text-alagoinhas-300"></i>
                </div>
                <h3 class="text-xl font-bold font-display text-alagoinhas-900 dark:text-white">Gerenciar Administradores</h3>
            </div>

            <div class="glass-card rounded-2xl p-6">
                <form id="add-admin-form" class="flex gap-3 mb-6">
                    <input type="email" id="new-admin-email" required placeholder="novo.admin@email.com" class="input-field flex-1" />
                    <button type="submit" class="bg-alagoinhas-500 hover:bg-alagoinhas-600 text-white font-bold rounded-xl px-6 py-3 transition-all flex items-center gap-2">
                        <i data-lucide="plus" class="w-5 h-5"></i> Adicionar
                    </button>
                </form>

                <div id="admins-list" class="space-y-2">
                    <p class="text-center text-slate-500 py-4">Carregando administradores...</p>
                </div>
            </div>
        </div>
        <!-- FIM DA NOVA SEÇÃO -->

    </main>

    <footer class="relative z-10 border-t border-alagoinhas-100 dark:border-white/5 glass-effect mt-auto">
        <div class="max-w-5xl mx-auto px-4 py-8 text-center">
            <p class="text-alagoinhas-700/70 dark:text-alagoinhas-300/70 text-sm font-medium">Alagoinhas - BA</p>
        </div>
    </footer>

    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>

    <script>
        lucide.createIcons();

        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            lucide.createIcons();
        });

        const ticketCheckbox = document.getElementById('has-ticket');
        const ticketFields = document.getElementById('ticket-fields');
        ticketCheckbox.addEventListener('change', () => {
            ticketFields.classList.toggle('open', ticketCheckbox.checked);
        });
    </script>
</body>
</html>
